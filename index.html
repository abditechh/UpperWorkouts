<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06101a"><title>Abdi Training</title><style>:root{--bg:#06101a;--card:#0b1a28;--line:#19354c;--cyan:#1ebcff;--green:#4ee59d;--muted:#91a1b5}*{box-sizing:border-box}body{margin:0;background:#03080e;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.phone{max-width:430px;min-height:100vh;margin:auto;background:linear-gradient(#07121d,#040a10);padding:calc(16px + env(safe-area-inset-top)) 14px 60px}.screen{display:none}.screen.on{display:block}.greet{font-size:14px;color:#c6d2de}.today{font-size:30px;line-height:1;font-weight:900;margin:5px 0 14px}.today span{color:var(--cyan)}.hero,.row,.weekrow,.info,.instructions{border:1px solid var(--line);background:#091725}.hero{border-radius:18px;padding:13px;display:grid;grid-template-columns:90px 1fr;gap:12px;align-items:center}.hero img{width:90px;height:112px;object-fit:cover;border-radius:12px}.hero h2{margin:0 0 5px}.sub{color:var(--muted);font-size:11px}.start{grid-column:1/-1;background:var(--cyan);border:0;border-radius:10px;padding:12px;font-weight:900}.sect{display:flex;justify-content:space-between;margin:20px 2px 8px}.sect span{color:var(--cyan);font-size:10px}.weekrow,.row{border-radius:10px;margin-bottom:6px;display:flex;align-items:center;gap:9px;padding:8px}.weekrow .d{width:34px;color:var(--cyan);font-size:10px}.weekrow b,.row b{font-size:11px}.weekrow small{display:block;color:var(--muted);font-size:8px}.back{background:none;border:0;color:var(--cyan);font-size:16px;padding:4px 0 12px}.workhead h1{font-size:26px;margin:0}.workhead p{color:var(--muted);font-size:11px}.progress{height:5px;background:#102337;border-radius:8px;overflow:hidden;margin:10px 0 13px}.bar{height:100%;background:var(--cyan)}.num{background:#a7dfff;color:#052035;width:24px;height:24px;border-radius:6px;display:grid;place-items:center;font-weigh d="workDay"></p></div><div class="progress"><div id="bar" class="bar"></div></div><div id="rows"></div></section><section id="exercise" class="screen detail"><button class="back" onclick="show('work')">‹ Back</button><h1 id="exName"></h1><div id="exSub" class="sub"></div><div class="photos"><div class="photo start"><img id="p1"><span>Start Position</span></div><div class="photo end"><img id="p2"><span>End Position</span></div></div><div class="two"><div class="info"><b>Sets & Reps</b><strong id="reps"></strong></div><div class="info"><b>Rest Time</b><strong id="rest"></strong></div></div><div class="instructions"><b>Instructions</b><ul id="cues"></ul></div><div id="credit" class="credit"></div><button id="complete" class="complete">Mark as Complete ✓</button></section></main><script>const C=f=>'https://commons.wikimedia.org/wiki/Special:Redirect/file/'+encodeURIComponent(f);const local=n=>'images/'+n+'.png';const P={hack:C('HackSquatMachineExercise.JPG'),rdl:C('U.S. Army recruiter demonstrates correct way to properly lift deadlift, Gaithersburg, Maryland (2020), 1.jpg'),lunge:C('Stockholm HYROX lunges.jpg'),ext:C('LegExtensionMachineExercise.JPG'),curl:C('LyingLegCurlMachineExercise.JPG'),calf:C('SeatedCalfRaiseMachineExercise.JPG'),legpress:C('Young man doing leg with machine in gym.jpg'),bulgarian:C('SETAF-AF conducts sergeant’s time circuit training (9082703).jpg'),reverse:C('Spangdahlem AB tests new PT options (6772670).jpg')};const E=(n,r,t,img,cues,credit='')=>[n,r,t,img,cues,credit];const W={ua:{day:'Monday',name:'Upper A',focus:'Chest · Back · Shoulders · Arms',cover:local(3),ex:[E('Incline Dumbbell Press','3 × 6–10','2–3 min',local(3),['Lower slowly','Keep shoulder blades stable','Press with control']),E('Pull-Ups','3 × 6–10','2–3 min',local(2),['Full stretch','Drive elbows down','Avoid swinging']),E('Seated Cable Row','3 × 8–12','2 min',local(4),['Sit tall','Pull elbows back','Squeeze your back']),E('Overhead Press','2 × 6–10','2–3 min',local(1),['Brace your core','Press smoothly']),E('Lateral Raise','3 × 12–20','60–90 sec',local(5),['Use control','Lead with elbows']),E('Rope Face Pull','2 × 12–20','60–90 sec',local(7),['Pull toward face','Control return']),E('Dumbbell Curl','2 × 10–15','60–90 sec',local(8),['Keep elbows still','No swinging'])]},la:{day:'Tuesday',name:'Lower A + Abs',focus:'Quads · Hamstrings · Glutes · Abs',cover:P.hack,ex:[E('Hack Squat','3 × 6–10','2–3 min',P.hack,['Stable stance','Brace your core','Use controlled depth','Drive through the whole foot'],'Photo: George Stepanek · Wikimedia Commons · CC BY-SA 3.0'),E('Romanian Deadlift','3 × 6–10','2–3 min',P.rdl,['Keep the bar close','Push hips back','Keep knees softly bent','Drive hips forward to stand'],'Photo: U.S. Army · Wikimedia Commons · public domain'),E('Walking Lunges','2 × 8–12 / leg','2 min',P.lunge,['Keep torso upright','Take a controlled step','Lower the back knee','Drive through the front foot'],'Photo: HybridFitty · Wikimedia Commons · CC BY 4.0'),E('Leg Extension','3 × 8–12','60–90 sec',P.ext,['Align knee with machine pivot','Extend under control','Squeeze quads at the top','Lower slowly'],'Photo: George Stepanek · Wikimedia Commons · CC BY-SA 3.0'),E('Leg Curl','3 × 10–15','60–90 sec',P.curl,['Keep hips stable','Curl through full range','Squeeze hamstrings','Control the return'],'Photo: George Stepanek · Wikimedia Commons · CC BY-SA 3.0'),E('Seated Calf Raise','4 × 10–15','60–90 sec',P.calf,['Use a full stretch','Drive through toes','Pause at the top','Avoid bouncing'],'Photo: George Stepanek · Wikimedia Commons · CC BY-SA 3.0'),E('Cable Crunch','3 × 12–15','60–90 sec',local(15),['Curl ribs toward pelvis','Exhale as you crunch','Control the return']),E('Hanging Leg Raise','3 × 10–15','60–90 sec',local(16),['Avoid swinging','Curl pelvis upward','Control the lowering'])]},ub:{day:'Thursday',name:'Upper B',focus:'Back · Chest · Shoulders · Arms',cover:local(6),ex:[E('Flat Bench Press','3 × 6–10','2–3 min',local(3),['Plant your feet','Control the lowering']),E('Lat Pulldown','3 × 8–12','2 min',local(2),['Stretch at top','Pull elbows down']),E('Chest-Supported Row','3 × 8–12','2 min',local(4),['Keep chest supported','Squeeze your back']),E('Cable Crossover','2 × 10–15','90 sec',local(6),['Use a controlled stretch','Squeeze chest']),E('Lateral Raise','3 × 12–20','60–90 sec',local(5),['Lead with elbows','Avoid momentum']),E('Rope Face Pull','2 × 12–20','60–90 sec',local(7),['Pull toward face','Squeeze rear delts']),E('Close-Grip Bench Press','2 × 8–12','2 min',local(3),['Control elbows','Drive with triceps']),E('Dumbbell Curl','2 × 10–15','60–90 sec',local(8),['No swinging','Full range'])]},lb:{day:'Friday',name:'Lower B + Abs',focus:'Legs · Glutes · Calves · Abs',cover:P.legpress,ex:[E('Leg Press','3 × 8–12','2–3 min',P.legpress,['Keep hips against pad','Lower under control','Drive through the whole foot'],'Photo: Nenad Stojkovic · Wikimedia Commons · CC BY 2.0'),E('Hip Thrust','3 × 8–12','2 min',local(18),['Drive through heels','Squeeze glutes','Avoid overextending your back']),E('Bulgarian Split Squat','2 × 8–12 / leg','2 min',P.bulgarian,['Set a stable stance','Lower slowly','Keep front foot planted','Drive up under control'],'Photo: U.S. Army · Wikimedia Commons · public domain'),E('Leg Extension','2 × 10–15','90 sec',P.ext,['Extend smoothly','Squeeze quads','Lower under control'],'Photo: George Stepanek · Wikimedia Commons · CC BY-SA 3.0'),E('Leg Curl','3 × 10–15','90 sec',P.curl,['Use full range','Control the negative'],'Photo: George Stepanek · Wikimedia Commons · CC BY-SA 3.0'),E('Seated Calf Raise','3 × 8–15','90 sec',P.calf,['Stretch fully','Pause at the top'],'Photo: George Stepanek · Wikimedia Commons · CC BY-SA 3.0'),E('Cable Crunch','3 × 10–15','60–90 sec',local(15),['Curl ribs toward pelvis','Control the return']),E('Reverse Crunch','2 × 10–20','60 sec',P.reverse,['Curl pelvis upward','Avoid momentum','Lower under control'],'Photo: U.S. Air Force · Wikimedia Commons · public domain')]}};const order=['ua','la','ub','lb'],map={1:'ua',2:'la',4:'ub',5:'lb'};let wk='ua',ei=0;const $=x=>document.getElementById(x);function fail(img,name){img.onerror=()=>img.outerHTML='<div class="fallback">'+name+'<br>photo unavailable</div>'}function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));$(id).classList.add('on');if(id==='home')home();if(id==='work')work();scrollTo(0,0)}function home(){let d=new Date().getDay(),k=map[d]||'ua',w=W[k];$('dayword').textContent=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][d];$('heroName').textContent=map[d]?w.name:'Recovery Day';$('heroFocus').textContent=map[d]?w.focus:'Rest · Walk · Sleep · Recover';$('heroImg').src=w.cover;fail($('heroImg'),w.name);$('start').style.display=map[d]?'block':'none';$('start').onclick=()=>{wk=k;show('work')};$('week').innerHTML=order.map(k=>'<div class="weekrow" onclick="wk=\''+k+'\';show(\'work\')"><div class="d">'+W[k].day.slice(0,3).toUpperCase()+'</div><div><b>'+W[k].name+'</b><small>'+W[k].focus+'</small></div></div>').join('')}function work(){let w=W[wk],a=JSON.parse(localStorage.getItem('done-'+wk)||'[]');$('workName').textContent=w.name;$('workDay').textContent=w.day+' · '+w.focus;$('bar').style.width=(a.length/w.ex.length*100)+'%';$('rows').innerHTML=w.ex.map((e,i)=>'<div class="row" onclick="ei='+i+';detail()"><div class="num">'+(i+1)+'</div><img class="thumb" src="'+e[3]+'"><div class="rmain"><b>'+e[0]+'</b><span class="badge">'+e[1]+'</span><span class="badge rest">'+e[2]+'</span></div><span>›</span></div>').join('')}function detail(){let e=W[wk].ex[ei];$('exName').textContent=e[0];$('exSub').textContent=W[wk].name+' · Exercise '+(ei+1);$('p1').src=e[3];$('p2').src=e[3];fail($('p1'),e[0]);fail($('p2'),e[0]);$('reps').textContent=e[1];$('rest').textContent=e[2];$('cues').innerHTML=e[4].map(x=>'<li>'+x+'</li>').join('');$('credit').textContent=e[5]||'';$('complete').onclick=()=>{let a=JSON.parse(localStorage.getItem('done-'+wk)||'[]');if(!a.includes(ei))a.push(ei);localStorage.setItem('done-'+wk,JSON.stringify(a));show('work')};show('exercise')}home();</script></body></html>
